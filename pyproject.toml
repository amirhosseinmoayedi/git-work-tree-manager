[project]
name = "worktree-manager"
version = "0.1.0"
description = "Generic Git worktree and per-worktree environment manager for agent workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyturso>=0.6.1",
]

[project.scripts]
wtm = "worktree_manager.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
